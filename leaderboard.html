<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EviSynth — Autonomic Scoping Review · Leaderboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
.page{max-width:900px;margin:0 auto;padding:1.5rem 1rem 3rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid #2a2a2a}
.board-title{font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:2px;color:#fff;line-height:1}
.board-sub{font-size:12px;color:#666;margin-top:4px;letter-spacing:0.05em;text-transform:uppercase}
.sync-pill{display:flex;align-items:center;gap:6px;background:#1a1a1a;padding:5px 12px;border-radius:20px;font-size:12px;color:#888}
.dot{width:7px;height:7px;border-radius:50%;background:#444;flex-shrink:0}
.dot.live{background:#4ade80;box-shadow:0 0 8px #4ade8088}
.dot.loading{background:#facc15}
.section-label{font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#555;margin-bottom:1rem}
.board-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:14px;padding:1.5rem;margin-bottom:2rem}
.board-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.5rem}
.board-name{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;color:#fff}
.board-date{font-size:11px;color:#555}
.bars-wrap{display:flex;align-items:flex-end;gap:10px;height:300px;position:relative}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;height:100%;justify-content:flex-end;position:relative}
.bar-outer{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;position:relative}
.bar{width:100%;border-radius:6px 6px 0 0;transition:height 0.7s cubic-bezier(.34,1.4,.64,1);position:relative;min-height:4px}
.bar-val{font-family:'Bebas Neue',sans-serif;font-size:20px;color:#fff;position:absolute;top:-28px;width:100%;text-align:center;letter-spacing:1px}
.bar-nhp{position:absolute;top:-72px;width:100%;display:flex;justify-content:center;animation:float 2.2s ease-in-out infinite}
.bar-nhp.leader{animation:float 1.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.bar-name{font-size:13px;font-weight:700;color:#bbb;margin-top:8px;letter-spacing:0.04em;text-align:center;line-height:1.3}
.bar-species{font-size:11px;color:#666;margin-top:2px;text-align:center;font-style:italic}
.bar-rank{font-size:14px;margin-top:3px;text-align:center}
.bar-0{background:linear-gradient(180deg,#ffd700 0%,#f59e0b 100%)}
.bar-1{background:linear-gradient(180deg,#c0c0c0 0%,#9ca3af 100%)}
.bar-2{background:linear-gradient(180deg,#cd7f32 0%,#92400e 100%)}
.bar-3{background:linear-gradient(180deg,#6366f1 0%,#4338ca 100%)}
.bar-4{background:linear-gradient(180deg,#ec4899 0%,#be185d 100%)}
.crown{position:absolute;top:-90px;font-size:18px;width:100%;text-align:center;animation:crownbob 1.2s ease-in-out infinite}
@keyframes crownbob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
.axis-line{position:absolute;bottom:0;left:0;right:0;height:1px;background:#1e1e1e;pointer-events:none}
.ticker{background:#1a1a1a;border-radius:8px;padding:10px 16px;margin-bottom:2rem;font-size:12px;color:#555;line-height:1.8}
.ticker strong{color:#888}
.empty{text-align:center;padding:3rem 1rem;color:#444;font-size:13px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#555;text-decoration:none;margin-bottom:1.5rem}
.back-link:hover{color:#888}
.roster{width:100%;margin-bottom:2rem}

.roster-emoji{font-size:32px;margin-bottom:6px}
.roster-init{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:#fff}
.roster-name{font-size:10px;color:#666;margin-top:2px;white-space:nowrap}
.roster-species{font-size:9px;color:#777;margin-top:2px;white-space:nowrap}
.roster-latin{font-size:9px;color:#555;font-style:italic;margin-top:1px;white-space:nowrap}
@media(max-width:500px){.bars-wrap{height:220px;gap:6px}.bar-val{font-size:14px;top:-22px}.bar-nhp{font-size:24px;top:-52px}.board-title{font-size:28px}.roster{flex-direction:row;flex-wrap:wrap}.roster-emoji{font-size:22px}}
</style>
</head>

const REVS=['AF','JH','LH','CS','RS'];
const QS=['q1','q3','q4','q5'];

function weekBounds(){
  const now=new Date();
  const sun=new Date(now);sun.setDate(now.getDate()-now.getDay());sun.setHours(0,0,0,0);
  const sat=new Date(sun);sat.setDate(sun.getDate()+6);sat.setHours(23,59,59,999);
  return{start:sun.getTime(),end:sat.getTime(),sun,sat};
}
function lastWeekBounds(){
  const now=new Date();
  const thisSun=new Date(now);thisSun.setDate(now.getDate()-now.getDay());thisSun.setHours(0,0,0,0);
  const lastSun=new Date(thisSun);lastSun.setDate(thisSun.getDate()-7);
  const lastSat=new Date(thisSun);lastSat.setDate(thisSun.getDate()-1);lastSat.setHours(23,59,59,999);
  return{start:lastSun.getTime(),end:lastSat.getTime(),sun:lastSun,sat:lastSat};
}
function fmtDate(d){return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}

function countCompleted(decisions){
  const counts={};REVS.forEach(r=>{counts[r]=0;});
  Object.entries(decisions).forEach(([rev,recs])=>{
    if(!counts.hasOwnProperty(rev))return;
    Object.entries(recs).forEach(([recId,data])=>{
      const ans=data.answers||data;
      if(QS.some(q=>ans[q]==='yes')||QS.every(q=>ans[q]))counts[rev]++;
    });
  });
  return counts;
}

function countWeek(decisions,ws,we){
  // Use updatedAt timestamp on decision docs to count completions this week
  const counts={};REVS.forEach(r=>{counts[r]=0;});
  Object.entries(decisions).forEach(([rev,recs])=>{
    if(!counts.hasOwnProperty(rev))return;
    Object.entries(recs).forEach(([recId,data])=>{
      const ts=data._updatedAt||0;
      if(ts<ws||ts>we)return;
      const ans=data.answers||data;
      const QS=['q1','q3','q4','q5'];
      if(QS.some(q=>ans[q]==='yes')||QS.every(q=>ans[q]))counts[rev]++;
    });
  });
  return counts;
}

function renderRoster(){
  document.getElementById('roster').innerHTML=
    '<table style="width:100%;border-collapse:separate;border-spacing:8px 0;table-layout:fixed"><tr>'+
    REVS.map(r=>`<td style="background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:12px 6px;text-align:center;vertical-align:top">
      <img src="${NHP[r].img}" style="width:72px;height:72px;object-fit:contain;display:block;margin:0 auto 6px"/>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:#fff">${r}</div>
      <div style="font-size:10px;color:#888;margin-top:2px">${NHP[r].name}</div>
      <div style="font-size:10px;color:#bbb;margin-top:1px">${NHP[r].species}</div>
      <div style="font-size:9px;color:#555;font-style:italic;margin-top:1px">${NHP[r].latin}</div>
    </td>`).join('')+
    '</tr></table>';
}

function renderBars(containerId,counts){
  const container=document.getElementById(containerId);
  const sorted=REVS.map(r=>({rev:r,count:counts[r]||0})).sort((a,b)=>b.count-a.count);
  const maxVal=Math.max(...sorted.map(s=>s.count),1);
  const MAX_H=200;
  if(sorted.every(s=>s.count===0)){
    container.innerHTML=`<div class="empty" style="width:100%">No decisions recorded yet — get screening!</div>`;
    return;
  }
  container.innerHTML=sorted.map((s,i)=>{
    const h=Math.max(Math.round((s.count/maxVal)*MAX_H),s.count>0?10:2);
    const crown=i===0&&s.count>0?`<span class="crown">👑</span>`:'';
    const nhpClass=i===0?'bar-nhp leader':'bar-nhp';
    return`<div class="bar-col">
      <div class="bar-outer">
        ${crown}
        <img class="${nhpClass}" src="${NHP[s.rev].img}" style="width:56px;height:56px;object-fit:contain"/>
        <div class="bar bar-${i}" style="height:${h}px">
          <span class="bar-val">${s.count}</span>
        </div>
      </div>
      <div class="bar-name">${s.rev}</div>
      <div class="bar-species">${NHP[s.rev].species}</div>
      <div class="bar-rank">${['🥇','🥈','🥉','4th','5th'][i]}</div>
    </div>`;
  }).join('')+'<div class="axis-line"></div>';
}

function updateTicker(allCounts,weekCounts){
  const leader=REVS.reduce((a,b)=>allCounts[a]>=allCounts[b]?a:b);
  const weekLeader=REVS.reduce((a,b)=>weekCounts[a]>=weekCounts[b]?a:b);
  const total=Object.values(allCounts).reduce((a,b)=>a+b,0);
  const allZero=total===0;
  document.getElementById('ticker').innerHTML=allZero
    ?`<strong>No decisions yet.</strong> First one to screen a record takes the crown.`
    :`<strong>${NHP[leader].emoji} All-time leader:</strong> ${NHP[leader].name} — ${allCounts[leader]} records &nbsp;·&nbsp; `+
     `<strong>${NHP[weekLeader].emoji} This week:</strong> ${NHP[weekLeader].name} — ${weekCounts[weekLeader]} records &nbsp;·&nbsp; `+
     `<strong>Total decisions:</strong> ${total}`;
}

let decisionsData={};
let scoreEventsData=[];

function refresh(){
  const{start,end,sun,sat}=weekBounds();
  document.getElementById('weekLabel').textContent='Week of '+fmtDate(sun);
  document.getElementById('weekRange').textContent=fmtDate(sun)+' – '+fmtDate(sat);
  const allCounts=countCompleted(decisionsData);
  const weekCounts=countWeek(decisionsData,start,end);
  const totalRecs=Object.keys(Object.values(decisionsData).reduce((acc,recs)=>{Object.keys(recs).forEach(k=>acc[k]=1);return acc},{})).length;
  document.getElementById('totalRecords').textContent=totalRecs+' unique records touched';
  renderBars('weekBars',weekCounts);
  renderBars('allBars',allCounts);

  // Last week
  const lw=lastWeekBounds();
  const lastWeekCounts=countWeek(decisionsData,lw.start,lw.end);
  const lwLabel=document.getElementById('lastWeekLabel');
  const lwRange=document.getElementById('lastWeekRange');
  const lwWinner=document.getElementById('lastWeekWinner');
  if(lwLabel)lwLabel.textContent='Week of '+fmtDate(lw.sun);
  if(lwRange)lwRange.textContent=fmtDate(lw.sun)+' – '+fmtDate(lw.sat);
  renderBars('lastWeekBars',lastWeekCounts);
  if(lwWinner){
    const lwTotal=Object.values(lastWeekCounts).reduce((a,b)=>a+b,0);
    if(lwTotal===0){
      lwWinner.innerHTML='<span style="color:#444;font-style:italic">No decisions recorded last week.</span>';
    } else {
      const winner=REVS.reduce((a,b)=>lastWeekCounts[a]>=lastWeekCounts[b]?a:b);
      lwWinner.innerHTML=`🏆 <strong style="color:#ffd700">${NHP[winner].name}</strong> took last week with <strong style="color:#ffd700">${lastWeekCounts[winner]}</strong> records screened.`;
    }
  }

  updateTicker(allCounts,weekCounts);
}

renderRoster();

onSnapshot(collection(db,'decisions'),snap=>{
  decisionsData={};
  snap.forEach(d=>{
    const x=d.data();
    if(!decisionsData[x.rev])decisionsData[x.rev]={};
    // store answers + timestamp together
    const entry={...( x.answers||{})};
    entry._updatedAt=x.updatedAt||0;
    decisionsData[x.rev][x.recId]=entry;
  });
  document.getElementById('syncDot').className='dot live';
  document.getElementById('syncLbl').textContent='Live';
  refresh();
},()=>{document.getElementById('syncDot').className='dot';document.getElementById('syncLbl').textContent='Offline';});

onSnapshot(collection(db,'score_events'),snap=>{
  scoreEventsData=[];snap.forEach(d=>scoreEventsData.push(d.data()));refresh();
});
</script>
